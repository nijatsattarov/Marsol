  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Register the PWA service worker as soon as the page is interactive.
      // The SW lives at /service-worker.js — see public/service-worker.js.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/service-worker.js', { scope: '/' })
            .then(function (reg) {
              // When a new SW takes control, refresh once so users get the latest assets.
              if (reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
              if (reg) {
                reg.addEventListener('updatefound', function () {
                  var nw = reg.installing;
                  if (!nw) return;
                  nw.addEventListener('statechange', function () {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                      // A new SW is ready — silently apply on next reload.
                      reg.waiting && reg.waiting.postMessage('SKIP_WAITING');
                    }
                  });
                });
              }
            })
            .catch(function () { /* swallow — non-fatal */ });

          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
